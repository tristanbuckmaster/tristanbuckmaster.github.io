name: Website

on:
  push:
    branches: [master, main, codex/plates-profile]
  pull_request:
    branches: [master, main]

env:
  BUNDLE_FROZEN: "true"

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          bundler-cache: true
      - run: bin/build-cv --check
      - run: bin/test-courant-upload
      - run: bundle exec jekyll build

  publish-github-pages:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          bundler-cache: true
      - name: Publish to the gh-pages branch
        run: |
          git config user.name "GitHub Action"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash bin/deploy --verbose --src "$GITHUB_REF_NAME" --deploy gh-pages <<< y
