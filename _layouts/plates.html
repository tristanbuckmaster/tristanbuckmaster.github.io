<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url | escape }}">
  <title>{% unless page.url == '/' %}{{ page.title | escape }} · {% endunless %}{{ site.data.profile.name | escape }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/plates.css' | relative_url }}">
  {% if page.page_css %}<link rel="stylesheet" href="{{ page.page_css | prepend: '/assets/css/' | append: '.css' | relative_url }}">{% endif %}
  {% if page.page_js %}<script defer src="{{ page.page_js | prepend: '/assets/js/' | append: '.js' | relative_url }}"></script>{% endif %}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {% include plates/header.html %}
  <main id="main">{{ content }}</main>
  {% include plates/footer.html %}
</body>
</html>
