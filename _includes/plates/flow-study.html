<div class="flow-study" data-flow-study>
  {% for run in item.simulations %}
    <video class="feature-image" controls muted playsinline preload="none"
           {% unless forloop.first %}hidden{% endunless %}
           poster="{{ item.figure | relative_url }}" width="{{ item.width }}" height="{{ item.height }}"
           aria-label="{{ run.label | escape }} vortex simulation" aria-describedby="caption-{{ item.id }}">
      <source src="{{ run.file | relative_url }}" type="video/mp4">
      <a href="{{ run.file | relative_url }}">Open the {{ run.label | downcase }} simulation (MP4)</a>
    </video>
  {% endfor %}
  <fieldset class="flow-options" hidden>
    <legend>Compare viscosity</legend>
    {% for run in item.simulations %}
      <label><input type="radio" name="flow-{{ item.id }}" value="{{ forloop.index0 }}"{% if forloop.first %} checked{% endif %}>
        {{ run.label | escape }} <span>ν = {{ run.viscosity | escape }}</span></label>
    {% endfor %}
  </fieldset>
  <noscript>
    <div class="flow-links">{% for run in item.simulations %}<a href="{{ run.file | relative_url }}">{{ run.label | escape }} (MP4)</a> {% endfor %}</div>
  </noscript>
</div>
