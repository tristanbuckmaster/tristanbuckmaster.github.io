- id: singularity
  paper_key: AlpogeBuckmaster2026NavierStokes
  topic: Singularity formation
  title: Singularities in Navier–Stokes flow
  description: In our preprint, Levent Alpöge and I study how a smooth three-dimensional flow can develop a singularity in finite time without external forcing.
  paper: Finite-time blow-up for the Navier–Stokes equations
  url: https://github.com/tristanbuckmaster/navier-stokes
  figure: /assets/figures/navier-stokes-vorticity.webp
  width: 1860
  height: 679
  light_ground: true
  alt: Two magenta and purple isosurfaces of vorticity magnitude. The lower level forms a connected whorl, and the higher level shows separated filaments.
  caption: Vorticity magnitude in the computed approximate profile at s = 0. The surfaces show level 50 (left) and level 85 (right). Color indicates height.
  figure_label: Figure 1, p. 4
  figure_source: https://github.com/tristanbuckmaster/navier-stokes/blob/b86ec358087c6d32c4bff73f4ef440f7491b426f/paper/finite-time-blow-up-navier-stokes.pdf
- id: non-uniqueness
  paper_key: BuckmasterCoiculescuLi2026LerayHopf
  topic: Non-uniqueness
  title: One initial velocity, different flows
  description: In a preprint with Matei P. Coiculescu and Chen Li, we describe two Leray–Hopf solutions of the unforced three-dimensional Navier–Stokes equations with the same initial velocity.
  paper: Non-Uniqueness of Leray–Hopf Solutions to the Unforced Three-Dimensional Navier–Stokes Equations
  url: https://hexagonmath.org/2611.00143v1
  width: 660
  height: 310
  clips:
    - label: Symmetric train
      movie: /assets/figures/viscous-ring-lift.mp4
      poster: /assets/figures/viscous-ring-lift-poster.webp
      description: A train of round vortex cores gets smaller toward the axis on the left. The contours broaden symmetrically above and below the midline, then join into a common envelope.
      caption: A freely diffusing Gaussian core repeats at equal intervals in the planar train. The ring coordinates place smaller cores toward the axis on the left. As they broaden, their outer streamlines join symmetrically.
    - label: Perturbed train
      movie: /assets/figures/viscous-ring-mode.mp4
      poster: /assets/figures/viscous-ring-mode-poster.webp
      description: The same train of cores, with contours that tilt across the midline. Warm and cool lobes show where reflection symmetry breaks. The axes and clock match the symmetric train.
      caption: The same angular-two mode evolves at every core under the linearized equation. Warm and cool mark opposite departures from mirror symmetry across the dashed midline.
  figure_label: Vortex train, Gaussian instability and ring lift, §§3–5
  figure_source: https://hexagonmath.org/pdf/2611.00143v1#page=8
- id: wave-turbulence
  topic: Wave turbulence
  title: How waves exchange energy
  description: With Pierre Germain, Zaher Hani, and Jalal Shatah, I studied when a kinetic equation describes the average exchange of energy among Fourier modes of the nonlinear Schrödinger equation.
  paper: Onset of the wave turbulence description of the longtime behavior of the nonlinear Schrödinger equation
  url: https://doi.org/10.1007/s00222-021-01039-z
  figure: /assets/figures/wave-interaction-diagrams.svg
  width: 660
  height: 310
  alt: First- and third-order interaction trees combine three and seven initial Fourier modes, respectively, into the output mode k. Dashed branches mark conjugated factors.
  caption: Read these Feynman trees from the leaves up. Each fork combines three Fourier modes. A dashed branch carries a complex conjugate.
  figure_label: Equation (3.2b) and Figure 1
  figure_source: https://arxiv.org/pdf/1907.03667#page=12
