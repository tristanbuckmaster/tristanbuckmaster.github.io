- id: singularity
  paper_key: AlpogeBuckmaster2026NavierStokes
  topic: Singularity formation
  title: Singularities in Navier–Stokes flow
  description: In our preprint, Levent Alpöge and I study how a smooth three-dimensional flow can develop a singularity in finite time without external forcing.
  paper: Finite-time blow-up for the Navier–Stokes equations
