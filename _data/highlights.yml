- id: non-uniqueness
  paper_key: BuckmasterCoiculescuLi2026LerayHopf
  topic: Non-uniqueness
  title: One initial velocity, different flows
  description: In a preprint with Matei P. Coiculescu and Chen Li, we describe two Leray–Hopf solutions of the unforced three-dimensional Navier–Stokes equations with the same initial velocity.
  paper: Non-Uniqueness of Leray–Hopf Solutions to the Unforced Three-Dimensional Navier–Stokes Equations
  url: https://hexagonmath.org/2611.00143v1
  width: 660
  height: 310
  clips:
    - label: Base flow
      movie: /assets/figures/viscous-ring-lift.mp4
      poster: /assets/figures/viscous-ring-lift-poster.webp
      description: Four round vortex cores start in two pairs. Each pair tilts, develops a narrow waist and joins into one core. The smaller pair on the left merges first.
      caption: For this illustration we bring the vortices closer together in pairs. The contours show positive planar vorticity in the paper’s ring coordinates. Watch the inner pair on the left merge first.
    - label: Eigenmode perturbation
      movie: /assets/figures/viscous-ring-mode.mp4
      poster: /assets/figures/viscous-ring-mode-poster.webp
      description: A second view of the same two pairs merging, with a small angular perturbation in each initial core. The axes and clock match the base flow.
      caption: We add the Gaussian’s angular-two eigenmode to the initial vorticity and use the same viscosity and spacing. Pause while a pair is joining and switch views to compare the shape of its waist.
  figure_label: Gaussian instability and ring lift, §§4–5
  figure_source: https://hexagonmath.org/pdf/2611.00143v1#page=12
- id: wave-turbulence
  topic: Wave turbulence
  title: How waves exchange energy
  description: With Pierre Germain, Zaher Hani, and Jalal Shatah, I studied when a kinetic equation describes the average exchange of energy among Fourier modes of the nonlinear Schrödinger equation.
  paper: Onset of the wave turbulence description of the longtime behavior of the nonlinear Schrödinger equation
  url: https://doi.org/10.1007/s00222-021-01039-z
  figure: /assets/figures/wave-interaction-diagrams.svg
  width: 660
  height: 310
  alt: First- and third-order interaction trees combine three and seven initial Fourier modes, respectively, into the output mode k. Dashed branches mark conjugated factors.
  caption: Read these Feynman trees from the leaves up. Each fork combines three Fourier modes. A dashed branch carries a complex conjugate.
  figure_label: Equation (3.2b) and Figure 1
  figure_source: https://arxiv.org/pdf/1907.03667#page=12
